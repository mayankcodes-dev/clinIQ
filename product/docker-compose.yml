version: "3.9"
# ClinIQ — Docker Compose for local self-hosting.
# Production deployment is Cloudflare Workers (npm run deploy).
#
# Quick start:
#   1. cp .env.example .env   (then fill in keys — all optional for basic demo)
#   2. docker compose up
#   3. Open http://localhost:3000
#
# The app starts and shows its main screen without any API keys.
# AI features degrade gracefully when keys are absent:
#   - No GROQ_API_KEY     → deterministic fallback questions served
#   - No GEMINI_API_KEY   → keyword RAG (no embeddings), no document OCR
#   - No ELEVENLABS_*     → Bhashini TTS / browser speech synthesis used
#   - No DATABASE_URL     → queue & doctor dashboard disabled; interview works

services:
  cliniq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cliniq
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false         # app starts without .env — all keys are optional
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - GEMINI_MODEL=gemini-2.5-flash
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - cliniq-net

networks:
  cliniq-net:
    driver: bridge
